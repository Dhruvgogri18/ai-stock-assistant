<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff">
  <title>Stock Research</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f59e0b'/%3E%3Cpath d='M8 21l5-6 4 3 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="screener.css">
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-top">
      <a class="brand" href="#/"><span class="logo" id="logo"></span><span id="brandName">Stock Research</span></a>
      <button class="icon-btn" id="collapseBtn" title="Collapse sidebar"></button>
    </div>
    <button class="new-btn" id="newBtn"><span data-i="plus"></span>New</button>
    <nav class="nav">
      <button class="nav-item" id="navSearch"><span data-i="search"></span>Search<kbd>Ctrl K</kbd></button>
      <button class="nav-item" data-prompt="Show me the latest news on Reliance Industries"><span data-i="globe"></span>News</button>
      <button class="nav-item" data-soon="Markets dashboards arrive in Phase 2 (sector dashboards, market regime)."><span data-i="markets"></span>Markets</button>
      <button class="nav-item" data-go="#/screener"><span data-i="screener"></span>Screener</button>
      <button class="nav-item" data-go="#/watchlist"><span data-i="star"></span>Watchlist</button>
      <button class="nav-item" data-go="#/calendar"><span data-i="calendar"></span>Calendar</button>
      <button class="nav-item" data-go="#/alerts"><span data-i="bell"></span>Alerts<span class="nav-badge" id="alertBadge" hidden></span></button>
      <button class="nav-item" data-soon="Concall summaries are in the filings index, but there is no dedicated page yet."><span data-i="mic"></span>Concalls<span class="beta">BETA</span></button>
    </nav>
    <div class="recent" id="recent"></div>
    <div class="user" id="user"></div>
  </aside>

  <main id="main">
    <button class="icon-btn menu-btn" id="menuBtn" data-i="panel"></button>

    <section id="landing">
      <h1 id="greeting">What next?</h1>
      <div id="landingComposer"></div>
      <div class="chips">
        <button class="chip" data-fill="Build a screener: P/E below 25 and ROCE above 15"><i class="sq blue"></i>Build Screener</button>
        <button class="chip" data-fill="Research TCS: results, key ratios and how it compares with peers"><i class="sq yellow"></i>Research</button>
        <button class="chip" data-fill="Latest news on Reliance Industries"><i class="sq green"></i>News</button>
      </div>
    </section>

    <section id="chat" hidden>
      <header class="topbar">
        <span class="crumb-icon" data-i="chat"></span><span class="crumb-sep" data-i="chevR"></span>
        <span id="chatTitle" class="crumb-title"></span>
        <button class="icon-btn" id="moreBtn" data-i="more"></button>
        <button class="share-btn" id="shareBtn"><span data-i="send"></span>Share</button>
      </header>
      <div id="scroll"><div id="thread"></div></div>
      <div class="dock">
        <div id="chatComposer"></div>
        <p class="disclaimer">AI can make mistakes. Verify important information. Research only, not investment advice.</p>
      </div>
    </section>

    <section id="screener" class="page" hidden></section>
    <section id="watchlist" class="page" hidden></section>
    <section id="calendar" class="page" hidden></section>
    <section id="alerts" class="page" hidden></section>
  </main>
</div>
<div id="popover" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="screener.js"></script>
<script src="workspace.js"></script>
<script src="app.js"></script>
</body>
</html>
